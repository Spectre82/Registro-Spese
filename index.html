<style>
:root{--bg:#000;--card:#1C1C1E;--fill:#2C2C2E;--sel:#48484A;--ink:#fff;--mut:#98989F;--acc:#FFFFFF;--accbg:rgba(255,255,255,.14);--neg:#FF453A;--line:#38383A;--f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--f);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:18px 16px 100px}
.hero{padding:22px 4px 14px}
.lab{margin:0;color:var(--mut);font-weight:600;font-size:.95rem}
.big{margin:2px 0 4px;font-size:3.6rem;line-height:1.05;font-weight:700;letter-spacing:-.03em;color:var(--acc)}
.big.neg,.neg{color:var(--neg)}
.pos{color:var(--acc)}
.sub{margin:0;color:var(--mut)}
.card{background:var(--card);border-radius:16px;padding:4px 16px;margin:10px 0}
.card.pad{padding:16px}
h2{font-size:1.2rem;margin:26px 4px 6px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:.5px solid var(--line)}
.row:last-child{border-bottom:0}
.row small,li small{display:block;color:var(--mut);font-size:.82rem;font-weight:400}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:.5px solid var(--line)}
li:last-child{border-bottom:0}
li>span{flex:1;min-width:0}
li b{white-space:nowrap;font-weight:600}
.x{border:0;background:none;color:var(--mut);font-size:1.5rem;line-height:1;padding:4px 8px;cursor:pointer;border-radius:8px}
.empty{color:var(--mut);padding:14px 0;margin:0}
label{display:block;font-weight:500;font-size:.88rem;color:var(--mut);margin:12px 0 5px}
input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:12px 14px}
input::placeholder{color:#636366}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--acc);color:#000;font:600 1.05rem var(--f);padding:14px;cursor:pointer}
.btn:active{opacity:.8}
.btn.ghost{background:none;color:var(--neg);border:.5px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--mut);font:600 .95rem var(--f);padding:9px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--sel);color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(28,28,30,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px;gap:2px}
.tab{border:0;background:none;color:var(--mut);font:600 .8rem var(--f);padding:11px 2px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--accbg);color:var(--acc)}
@media (prefers-reduced-motion:no-preference){.big{transition:color .2s}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div class="in">
<button class="tab" data-tab="oggi">Oggi</button>
<button class="tab" data-tab="entrate">Entrate</button>
<button class="tab" data-tab="fisse">Fisse</button>
<button class="tab" data-tab="rate">Rate</button>
<button class="tab" data-tab="imp">Altro</button>
</div></nav>
<script>
const K='spese-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{init:false,liq:0,fisse:[],rate:[],entrate:[],mov:[]};S.entrate=S.entrate||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const T0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const mk=(y,m,day)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));
const nextD=day=>{const t=T0();let d=mk(t.getFullYear(),t.getMonth(),day);if(d<=t)d=mk(t.getFullYear(),t.getMonth()+1,day);return d};
const fmtD=d=>d.toLocaleDateString('it-IT',{day:'numeric',month:'long'});
const keyNow=()=>{const t=T0();return t.getFullYear()*12+t.getMonth()};
const passed=day=>{const t=T0();return mk(t.getFullYear(),t.getMonth(),day)<=t?keyNow():keyNow()-1};
const log=(t,imp,nota,auto)=>{S.mov.unshift({id:uid(),t,imp,nota,d:Date.now(),auto:!!auto});S.mov=S.mov.slice(0,200)};

function tick(){
  let ch=false;
  const run=(o,day,fn)=>{const p=passed(day);const n=Math.min(Math.max(p-o.last,0),12);if(n>0){fn(n);o.last=p;ch=true}};
  S.fisse.forEach(f=>run(f,f.giorno,n=>{S.liq-=f.imp*n;log('spesa',f.imp*n,f.nome,1)}));
  S.rate.forEach(r=>run(r,r.giorno,n=>{n=Math.min(n,r.rest);if(n>0){S.liq-=r.imp*n;r.rest-=n;log('spesa',r.imp*n,r.nome+' (rata)',1)}}));
  S.entrate.forEach(e=>run(e,e.giorno,n=>{S.liq+=e.imp*n;log('entrata',e.imp*n,e.nome,1)}));
  const before=S.rate.length;S.rate=S.rate.filter(r=>r.rest>0);
  if(ch||before!==S.rate.length)save();
}

function calc(){
  const t=T0(),ni=S.entrate.length?new Date(Math.min(...S.entrate.map(e=>nextD(e.giorno)))):nextD(1);
  const due=[...S.fisse.map(x=>({...x,k:'fissa'})),...S.rate.filter(r=>r.rest>0).map(x=>({...x,k:'rata'}))]
    .map(x=>({...x,dt:nextD(x.giorno)})).filter(x=>x.dt<ni).sort((a,b)=>a.dt-b.dt);
  const tot=due.reduce((a,x)=>a+x.imp,0);
  const free=S.liq-tot,days=Math.max(1,Math.round((ni-t)/864e5));
  return{ni,due,tot,free,days,fm:!S.entrate.length,per:Math.max(0,free)/days};
}

const field=(id,lab,val,mode,ph)=>`<label for="${id}">${lab}</label><input id="${id}" inputmode="${mode||'text'}" autocomplete="off" placeholder="${ph||''}" value="${val===''?'':esc(val)}">`;

const V={
  setup:()=>`<section class="hero"><p class="lab">Benvenuto</p><p class="big" style="font-size:2.2rem">Partiamo da un dato</p></section>
  <section class="card pad">${field('i-liq','Quanti soldi hai ora?','','decimal','es. 1.250,00')}
  
  
  <button class="btn" data-a="init">Inizia</button></section>`,

  oggi:()=>{
    const c=calc(),neg=c.free<0,fino=c.fm?'fino a fine mese':'fino al '+fmtD(c.ni);
    const due=c.due.length?`<ul>${c.due.map(x=>`<li><span>${esc(x.nome)}<small>${x.k==='rata'?'Rata':'Spesa fissa'} · ${fmtD(x.dt)}</small></span><b>${eur(x.imp)}</b></li>`).join('')}</ul>`:`<p class="empty">Nessuna uscita prevista per ora.</p>`;
    const mov=S.mov.length?`<ul>${S.mov.slice(0,10).map(m=>`<li><span>${esc(m.nota||(m.t==='spesa'?'Spesa':'Entrata'))}<small>${new Date(m.d).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}${m.auto?' · automatico':''}</small></span><b class="${m.t==='spesa'?'':'pos'}">${m.t==='spesa'?'−':'+'}${eur(m.imp)}</b>${m.auto?'':`<button class="x" data-a="delm" data-id="${m.id}" aria-label="Elimina movimento">×</button>`}</li>`).join('')}</ul>`:`<p class="empty">Ancora nessun movimento.</p>`;
    return `<section class="hero"><p class="lab">Puoi spendere oggi</p>
    <p class="big ${neg?'neg':''}">${eur(neg?0:c.per)}</p>
    <p class="sub">${neg?`Mancano ${eur(-c.free)} per coprire le uscite ${fino}.`:`al giorno per ${c.days} ${c.days===1?'giorno':'giorni'}, ${fino}.`}</p></section>
    <section class="card"><div class="row"><span>Liquidità attuale</span><b>${eur(S.liq)}</b></div>
    <div class="row"><span>Dopo fisse e rate in arrivo<small>${c.due.length?'Uscite previste: −'+eur(c.tot):'Nessuna uscita prevista'}</small></span><b class="${neg?'neg':''}">${eur(c.free)}</b></div></section>
    <h2>Nuovo movimento</h2><section class="card pad">
    <div class="seg"><button class="on" data-a="seg" data-v="spesa">Spesa</button><button data-a="seg" data-v="entrata">Entrata</button></div>
    ${field('m-imp','Importo','','decimal','0,00')}${field('m-nota','Note (facoltativo)','','text','es. Spesa al supermercato')}
    <button class="btn" data-a="mov">Registra</button></section>
    <h2>Uscite in arrivo</h2><section class="card">${due}</section>
    <h2>Ultimi movimenti</h2><section class="card">${mov}</section>`;
  },

  fisse:()=>{
    const tot=S.fisse.reduce((a,x)=>a+x.imp,0);
    const list=S.fisse.length?`<ul>${S.fisse.map(f=>`<li><span>${esc(f.nome)}<small>Il ${f.giorno} di ogni mese</small></span><b>${eur(f.imp)}</b><button class="x" data-a="delf" data-id="${f.id}" aria-label="Elimina ${esc(f.nome)}">×</button></li>`).join('')}</ul>`:`<p class="empty">Nessuna spesa fissa. Aggiungi la prima qui sotto.</p>`;
    return `<section class="hero"><p class="lab">Spese fisse al mese</p><p class="big">${eur(tot)}</p></section>
    <section class="card">${list}</section>
    <h2>Aggiungi spesa fissa</h2><section class="card pad">
    ${field('f-nome','Nome','','text','es. Netflix, affitto')}
    <div class="two"><div>${field('f-imp','Importo','','decimal','0,00')}</div><div>${field('f-g','Giorno del mese','','numeric','1–31')}</div></div>
    <button class="btn" data-a="addf">Aggiungi</button></section>`;
  },

  rate:()=>{
    const m=S.rate.reduce((a,x)=>a+x.imp,0),res=S.rate.reduce((a,x)=>a+x.imp*x.rest,0);
    const list=S.rate.length?`<ul>${S.rate.map(r=>`<li><span>${esc(r.nome)}<small>${r.rest} ${r.rest===1?'rata':'rate'} · residuo ${eur(r.imp*r.rest)} · il ${r.giorno} del mese</small></span><b>${eur(r.imp)}</b><button class="x" data-a="delr" data-id="${r.id}" aria-label="Elimina ${esc(r.nome)}">×</button></li>`).join('')}</ul>`:`<p class="empty">Nessuna rata attiva. Aggiungi la prima qui sotto.</p>`;
    return `<section class="hero"><p class="lab">Ancora da pagare a rate</p><p class="big">${eur(res)}</p><p class="sub">${eur(m)} al mese.</p></section>
    <section class="card">${list}</section>
    <h2>Aggiungi rateizzazione</h2><section class="card pad">
    ${field('r-nome','Nome','','text','es. iPhone, divano')}
    <div class="two"><div>${field('r-imp','Importo rata','','decimal','0,00')}</div><div>${field('r-rest','Rate rimaste','','numeric','es. 10')}</div></div>
    ${field('r-g','Giorno del mese dell’addebito','','numeric','1–31')}
    <button class="btn" data-a="addr">Aggiungi</button></section>`;
  },

  entrate:()=>{
    const t=T0(),m0=new Date(t.getFullYear(),t.getMonth(),1).getTime();
    const mese=S.mov.filter(x=>x.t==='entrata'&&x.d>=m0).reduce((a,x)=>a+x.imp,0);
    const rec=S.entrate.length?`<ul>${S.entrate.map(e=>`<li><span>${esc(e.nome)}<small>Il ${e.giorno} di ogni mese</small></span><b>${eur(e.imp)}</b><button class="x" data-a="dele" data-id="${e.id}" aria-label="Elimina ${esc(e.nome)}">×</button></li>`).join('')}</ul>`:`<p class="empty">Nessuna entrata ricorrente. Se ricevi una paghetta o una borsa di studio ogni mese, aggiungila qui sotto.</p>`;
    const ult=S.mov.filter(x=>x.t==='entrata').slice(0,10);
    const list=ult.length?`<ul>${ult.map(m=>`<li><span>${esc(m.nota||'Entrata')}<small>${new Date(m.d).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}${m.auto?' · automatico':''}</small></span><b>+${eur(m.imp)}</b>${m.auto?'':`<button class="x" data-a="delm" data-id="${m.id}" aria-label="Elimina entrata">×</button>`}</li>`).join('')}</ul>`:`<p class="empty">Ancora nessuna entrata.</p>`;
    return `<section class="hero"><p class="lab">Entrate di questo mese</p><p class="big">${eur(mese)}</p></section>
    <h2>Nuova entrata</h2><section class="card pad">
    ${field('e-imp','Importo','','decimal','0,00')}${field('e-nota','Da dove arriva (facoltativo)','','text','es. ripetizioni, regalo')}
    <button class="btn" data-a="adde">Registra entrata</button></section>
    <h2>Ultime entrate</h2><section class="card">${list}</section>
    <h2>Entrate ricorrenti</h2><section class="card">${rec}</section>
    <section class="card pad">
    ${field('c-nome','Nome','','text','es. paghetta, borsa di studio')}
    <div class="two"><div>${field('c-imp','Importo','','decimal','0,00')}</div><div>${field('c-g','Giorno del mese','','numeric','1–31')}</div></div>
    <button class="btn" data-a="addrec">Aggiungi entrata ricorrente</button></section>`;
  },

  imp:()=>`<section class="hero"><p class="lab">Impostazioni</p></section>
  <section class="card pad">
  ${field('i-liq','Liquidità attuale (correggila se non torna con la banca)',String(S.liq).replace('.',','),'decimal')}
  
  
  <button class="btn" data-a="saveset">Salva</button></section>
  <p class="sub" style="margin:14px 4px">Le spese fisse, le rate e le entrate ricorrenti si aggiornano da soli quando passa il giorno indicato. I dati restano su questo dispositivo.</p>
  <button class="btn ghost" data-a="reset">Cancella tutti i dati</button>`
};

let tab='oggi',seg='spesa';
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  app.innerHTML=(!S.init&&tab==='oggi')?V.setup():V[tab]();
}
const day=v=>Math.min(31,Math.max(1,Math.round(num(v))||1));

document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');
  if(tb){tab=tb.dataset.tab;seg='spesa';render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='seg'){seg=b.dataset.v;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));return}
  if(a==='init'||a==='saveset'){
    S.liq=num($('i-liq').value);
    S.init=true;save();if(a==='saveset')tab='oggi';render();return}
  if(a==='mov'){
    const imp=Math.abs(num($('m-imp').value));if(!imp){$('m-imp').focus();return}
    S.liq+=seg==='spesa'?-imp:imp;log(seg,imp,$('m-nota').value.trim());save();render();return}
  if(a==='addf'){
    const nome=$('f-nome').value.trim(),imp=Math.abs(num($('f-imp').value));
    if(!nome||!imp){(nome?$('f-imp'):$('f-nome')).focus();return}
    const g=day($('f-g').value);S.fisse.push({id:uid(),nome,imp,giorno:g,last:passed(g)});save();render();return}
  if(a==='addr'){
    const nome=$('r-nome').value.trim(),imp=Math.abs(num($('r-imp').value)),rest=Math.round(num($('r-rest').value));
    if(!nome||!imp||rest<1){(!nome?$('r-nome'):!imp?$('r-imp'):$('r-rest')).focus();return}
    const g=day($('r-g').value);S.rate.push({id:uid(),nome,imp,rest,giorno:g,last:passed(g)});save();render();return}
  if(a==='adde'){const imp=Math.abs(num($('e-imp').value));if(!imp){$('e-imp').focus();return}S.liq+=imp;log('entrata',imp,$('e-nota').value.trim());save();render();return}
  if(a==='addrec'){const nome=$('c-nome').value.trim(),imp=Math.abs(num($('c-imp').value));if(!nome||!imp){(nome?$('c-imp'):$('c-nome')).focus();return}const g=day($('c-g').value);S.entrate.push({id:uid(),nome,imp,giorno:g,last:passed(g)});save();render();return}
  if(a==='dele'){S.entrate=S.entrate.filter(x=>x.id!==id);save();render();return}
  if(a==='delf'){S.fisse=S.fisse.filter(x=>x.id!==id);save();render();return}
  if(a==='delr'){S.rate=S.rate.filter(x=>x.id!==id);save();render();return}
  if(a==='delm'){const m=S.mov.find(x=>x.id===id);if(m){S.liq+=m.t==='spesa'?m.imp:-m.imp;S.mov=S.mov.filter(x=>x.id!==id);save();render()}return}
  if(a==='reset'&&confirm('Cancellare tutti i dati? L’operazione non si può annullare.')){
    S={init:false,liq:0,fisse:[],rate:[],entrate:[],mov:[]};save();tab='oggi';render()}
});
tick();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
</script>
</body>
</html>
